name: Security and build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/security-foundation-20261117]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API security and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: highstyle-ci-only-not-a-deployment-secret-20261117
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: API/package-lock.json
      - name: Install locked API dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix API
      - name: Validate API schema and regression tests
        working-directory: API
        run: |
          node -e "require('@graphql-tools/schema').makeExecutableSchema({typeDefs:require('./GraphQL/TypeDef'),resolvers:require('./GraphQL/Resolver')}); console.log('GraphQL schema constructed')"
          node --test test/*.test.js
      - name: Capture installed dependencies for offline regression reproduction
        if: always()
        run: tar -czf api-dependencies.tgz -C API node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: api-dependencies-${{ github.sha }}
          path: api-dependencies.tgz
          retention-days: 3
  web:
    name: Build ${{ matrix.application }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        application: [frontend, backend]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://127.0.0.1:2024/graphql
      NEXT_PUBLIC_API_KEY: http://127.0.0.1:2024
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - name: Install existing lockfile (legacy peer dependencies)
        run: npm ci --legacy-peer-deps --prefix ${{ matrix.application }}
      - name: Production build
        run: npm run build --prefix ${{ matrix.application }}
