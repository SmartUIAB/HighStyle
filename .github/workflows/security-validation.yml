name: Security and build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/security-foundation-20261117]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API security, HTTP and MongoDB transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: highstyle-ci-only-not-a-deployment-secret-20261117
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/highstyle_ci?replicaSet=rs0
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: API/package-lock.json
      - name: Install locked API dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix API
      - name: Start an isolated MongoDB replica set
        run: |
          set -euo pipefail
          docker run --detach --name highstyle-ci-mongo --publish 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec highstyle-ci-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec highstyle-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 60); do
            if docker exec highstyle-ci-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo 'MongoDB replica set did not become ready'
          exit 1
      - name: Run schema, authorization, HTTP, storage and transaction tests
        working-directory: API
        run: |
          set -euo pipefail
          mkdir -p ../test-results
          node -e "require('./app').buildSchema().then(() => console.log('GraphQL schema constructed'))"
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=../test-results/api-junit.xml test/*.test.js
      - name: Retain API test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-test-results-${{ github.sha }}
          path: test-results/api-junit.xml
          retention-days: 14
      - name: Stop isolated database
        if: always()
        run: docker rm --force highstyle-ci-mongo || true
  web:
    name: Build ${{ matrix.application }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        application: [frontend, backend]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://127.0.0.1:2024/graphql
      NEXT_PUBLIC_API_KEY: http://127.0.0.1:2024
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - name: Install existing lockfile (legacy peer dependencies)
        run: npm ci --legacy-peer-deps --prefix ${{ matrix.application }}
      - name: Production build
        run: npm run build --prefix ${{ matrix.application }}
  dependency-audit:
    name: Dependency security ${{ matrix.application }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        application: [API, frontend, backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit runtime dependency lockfile (high and critical are blocking)
        working-directory: ${{ matrix.application }}
        run: npm audit --package-lock-only --omit=dev --audit-level=high --json > dependency-audit.json
      - name: Retain dependency advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit-${{ matrix.application }}-${{ github.sha }}
          path: ${{ matrix.application }}/dependency-audit.json
          retention-days: 14
