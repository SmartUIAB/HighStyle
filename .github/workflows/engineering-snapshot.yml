name: Engineering source snapshot
on:
  push:
    branches: [fix/security-foundation-20261117]
    paths: [.github/workflows/engineering-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Snapshot reviewed source and dependency metadata
        run: |
          set -euo pipefail
          mkdir -p evidence/registry
          git archive --format=tar HEAD -o evidence/source.tar
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse HEAD^{tree} > evidence/tree.txt
          for pkg in next@15 next@16 react@19 @apollo/server@5 @as-integrations/express4 graphql-upload@17 mongoose@8 stripe nodemailer@7 graphql-tag axios jspdf jspdf-autotable @playwright/test; do
            name=$(printf '%s' "$pkg" | tr '/@' '__')
            npm view "$pkg" version engines peerDependencies --json > "evidence/registry/$name.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-source-${{ github.sha }}
          path: evidence/
          retention-days: 3
