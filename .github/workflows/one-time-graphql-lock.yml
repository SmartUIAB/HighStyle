name: One-time GraphQL Tools lockfile correction
on:
  push:
    branches: [fix/security-foundation-20261117]
    paths: [.github/workflows/one-time-graphql-lock.yml]
permissions:
  contents: read
jobs:
  update-lock:
    if: github.repository == 'SmartUIAB/HighStyle' && github.ref == 'refs/heads/fix/security-foundation-20261117' && github.actor == 'baraabd'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Update only the locked security fix
        run: |
          set -euo pipefail
          node -e 'const p=require("./API/package.json"); if(p.overrides?.["@graphql-tools/utils"]!=="12.0.2")process.exit(1)'
          npm install --package-lock-only --ignore-scripts --prefix API
          node -e 'const l=require("./API/package-lock.json"); if(l.packages?.["node_modules/@graphql-tools/utils"]?.version!=="12.0.2")process.exit(1)'
          (cd API && npm audit --package-lock-only --omit=dev --audit-level=high)
      - name: Commit lockfile with branch lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/security-foundation-20261117 | cut -f1)" = "$GITHUB_SHA"
          git add API/package-lock.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): regenerate patched GraphQL Tools lockfile'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/fix/security-foundation-20261117
